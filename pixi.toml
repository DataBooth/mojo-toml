[project]
authors = ["Michael Booth <michael@databooth.com.au>"]
channels = ["conda-forge", "https://conda.modular.com/max"]
name = "mojo-toml"
platforms = ["linux-64", "linux-aarch64", "osx-arm64"]
version = "0.5.0"

[activation]
env = { MOJO_PATH = "$PIXI_PROJECT_ROOT/src" }

[tasks]
# Development tasks
mojo-version = "mojo --version"

# Individual tests (for quick iteration during development)
test-lexer = "mojo -I src tests/test_lexer.mojo"
test-parser = "mojo -I src tests/test_parser.mojo"
test-real-world = "mojo -I src tests/test_real_world.mojo"
test-fixtures = "mojo -I src tests/test_fixtures.mojo"
test-arrays = "mojo -I src tests/test_arrays.mojo"
test-tables = "mojo -I src tests/test_tables.mojo"
test-inline = "mojo -I src tests/test_inline.mojo"
test-dotted-keys = "mojo -I src tests/test_dotted_keys.mojo"
test-validation = "mojo -I src tests/test_validation.mojo"
test-parser-reset = "mojo -I src tests/test_parser_reset.mojo"

# Writer tests
test-writer-basic = "mojo -I src tests/test_writer_basic.mojo"
test-writer-tables = "mojo -I src tests/test_writer_tables.mojo"
test-writer-roundtrip = "mojo -I src tests/test_writer_roundtrip.mojo"

# Number base tests
test-number-bases = "mojo -I src tests/test_number_bases.mojo"

# Array of tables tests
test-array-of-tables = "mojo -I src tests/test_array_of_tables.mojo"

# TOML 1.1 escape sequences
test-toml11-escapes = "mojo -I src tests/test_toml11_escapes.mojo"

# Run all tests (auto-discovers test_*.mojo files)
test-all = "python scripts/run_tests.py"

# Build tasks
build-package = "mkdir -p dist && mojo package src/toml -o dist/toml.mojopkg"
clean = "rm -rf dist __pycache__ .pytest_cache toml.mojopkg"

# Release / validation tasks
validate-recipe = "./scripts/validate-recipe.sh recipe.yaml"
pre-submit = "python scripts/pre_submit_checklist.py"
pre-submit-modular-community = "python scripts/pre_submit_checklist.py"

# External integration tasks
clone-modular-community = "mkdir -p ~/code/github/external && cd ~/code/github/external && git clone https://github.com/modular-community/modular-community.git || (cd modular-community && git pull)"

# Example tasks
examples-all = "python scripts/run_examples.py"

# Benchmark tasks
benchmark-mojo = "python benchmarks/run_mojo_benchmark.py"
benchmark-python = "python benchmarks/compare_python.py"

# Code quality tasks
pre-commit = "pre-commit run --all-files"
pre-commit-install = "pre-commit install"

[dependencies]
max = ">=26.1.0,<27"
python = ">=3.11,<4"  # Required for test runner and benchmarks
tomli-w = ">=1.0.0,<2"  # For write benchmarks (tomllib is read-only)
pre-commit = ">=4.5.1,<5"
rattler-build = ">=0.55.1,<0.56"
