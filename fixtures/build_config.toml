# Build configuration file
# Similar to Cargo.toml or pyproject.toml

name = "mojo-lib"
version = "0.1.0"
edition = "2024"
authors = "DataBooth Team"

# Compilation settings
optimization_level = 3
debug_symbols = false
target = "native"
parallel_build = true

# Linting configuration
max_line_length = 100
allow_warnings = false
strict_mode = true

# Test configuration  
test_threads = 8
test_timeout = 300.0
coverage_threshold = 80.0
